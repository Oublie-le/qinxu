</style>
<script>
(function(){
const root=document.getElementById('qinxu-design');
const main=root.querySelector('.qx-main');
const app=root.querySelector('.qx-app');
const navItems=[['discover','compass','发现'],['library','library','我的谱架'],['practice','piano','练琴'],['report','chart-no-axes-combined','练习记录']];
const scores=[
{id:'moon',title:'月光',en:'CLAIR DE LUNE',composer:'Claude Debussy',zh:'德彪西',category:'古典',level:3,key:'降 D 大调',time:'9/8',bpm:66,art:'moon',bg:'#dfe6de',ink:'#344b44',shape:'#a8b7a6',tag:'进阶',desc:'让旋律像月光一样，轻轻落下来。'},
{id:'gym',title:'第一号裸体舞曲',en:'GYMNOPÉDIE No.1',composer:'Erik Satie',zh:'埃里克·萨蒂',category:'古典',level:1,key:'D 大调',time:'3/4',bpm:72,art:'arch',bg:'#efe3d5',ink:'#755444',shape:'#cba68b',tag:'入门',desc:'慢慢来，给每一个音留一点呼吸。'},
{id:'invention',title:'二部创意曲',en:'INVENTION No.1',composer:'J. S. Bach',zh:'巴赫',category:'古典',level:2,key:'C 大调',time:'4/4',bpm:84,art:'bars',bg:'#e9dca9',ink:'#665b27',shape:'#b0a15e',tag:'中级',desc:'在左右手的对话里，找到清晰的层次。'},
{id:'nocturne',title:'降 E 大调夜曲',en:'NOCTURNE Op.9 No.2',composer:'Frédéric Chopin',zh:'肖邦',category:'古典',level:3,key:'降 E 大调',time:'12/8',bpm:60,art:'moon',bg:'#dce4ea',ink:'#465a6c',shape:'#a1b7c4',tag:'进阶',desc:'把一句旋律，弹成一句温柔的话。'},
{id:'summer',title:'夏日来信',en:'LETTERS IN SUMMER',composer:'琴序 · 概念曲目',zh:'琴序',category:'流行',level:1,key:'C 大调',time:'4/4',bpm:80,art:'arch',bg:'#efcfbf',ink:'#8c4e3b',shape:'#cc9d7a',tag:'入门',desc:'用轻快的和弦，记住一个晴朗的下午。'},
{id:'cinema',title:'晚风里的电影',en:'AN EVENING FILM',composer:'琴序 · 概念曲目',zh:'琴序',category:'影视',level:2,key:'F 大调',time:'4/4',bpm:76,art:'bars',bg:'#dfded0',ink:'#5a6050',shape:'#a4ae8a',tag:'中级',desc:'熟悉的故事，在琴键上重新开始。'}];
let state={route:'discover',selected:'moon',filter:'推荐',query:'',device:'tablet',favorites:['moon','gym','nocturne'],version:'原版',hand:'双手',mode:'跟弹',tempo:66,playing:false,measure:5,loop:false,loopStart:5,loopEnd:8,connected:false,imported:false,libraryFilter:'全部曲谱'};
const coverImages=new Map();
const design={accent:'#d84932',radius:18};
let toastTimer=null,previousFocus=null,phoneByWidth=false,lastSavedSnapshot='';
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=()=>scores.find(s=>s.id===state.selected)||scores[0];
const coverStyle=s=>`--cover-bg:${s.bg};--cover-ink:${s.ink};--cover-shape:${s.shape}`;
function cover(s){const source=coverImages.get(s.id);return `<div class="qx-cover ${source?'qx-cover-photo':''}" data-art="${s.art}" style="${coverStyle(s)}" aria-hidden="true">${source?`<img src="${esc(source)}" alt="" class="qx-cover-image">`:`<div class="qx-cover-title">${s.title}</div><div class="qx-cover-en">${s.en}</div><div class="qx-cover-art"></div><div class="qx-cover-no">${s.zh}</div>`}</div>`;}
function level(s){return `<span class="qx-level" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=s.level?'on':''}"></i>`).join('')}</span>`;}
function scoreCard(s){const saved=state.favorites.includes(s.id);return `<article class="qx-score-item"><button class="qx-score-card" type="button" data-score="${s.id}" aria-label="查看${s.title}曲谱">${cover(s)}<h3 data-tooltip="${s.title}">${s.title}</h3><p>${s.zh}</p></button><div class="qx-score-meta">${level(s)}<span>${s.tag}</span><span class="qx-score-format">${icon('piano')}独奏</span></div><div class="qx-card-actions"><button type="button" data-favorite-score="${s.id}" class="${saved?'saved':''}" aria-label="${saved?'取消收藏':'收藏'}${s.title}" aria-pressed="${saved}">${icon(saved?'bookmark-check':'bookmark')}</button><button type="button" data-start-score="${s.id}" aria-label="练习${s.title}">${icon('play')}</button></div></article>`;}
function search(){return `<label class="qx-search">${icon('search')}<input id="qx-search" type="search" aria-label="搜索曲名或作曲家" placeholder="搜索曲名、作曲家" value="${esc(state.query)}"></label>`;}
function filtered(){return scores.filter(s=>(state.filter==='推荐'||s.category===state.filter||(state.filter==='入门'&&s.level===1))&&(!state.query||[s.title,s.en,s.composer,s.zh].join(' ').toLowerCase().includes(state.query.toLowerCase())));}
function discover(){const filterIcons={'推荐':'layout-grid','流行':'headphones','古典':'music-2','影视':'clapperboard','入门':'sprout'};return `<div class="qx-page-heading qx-search-heading"><h1 class="qx-page-title">曲谱</h1>${search()}<button type="button" class="qx-secondary" data-action="cover-manager">${icon('image-plus')}封面</button><button type="button" class="qx-primary" data-action="import">${icon('plus')}导入</button></div><div class="qx-pills qx-category-pills" aria-label="曲谱分类">${Object.keys(filterIcons).map(f=>`<button type="button" data-filter="${f}" aria-pressed="${state.filter===f}">${icon(filterIcons[f])}${f}</button>`).join('')}</div><section class="qx-resume-strip"><span class="qx-resume-icon">${icon('history')}</span><span class="qx-resume-title">最近练习<strong>月光</strong></span><span class="qx-resume-meta">第 5 小节 · 66 BPM</span><button type="button" data-action="continue">${icon('play')}继续</button></section><div class="qx-section-heading"><h2>${icon('music-4')}曲谱</h2><small id="qx-result-count">${filtered().length} 首</small></div><div class="qx-score-grid" id="qx-score-results">${filtered().map(scoreCard).join('')||'<div class="qx-empty">没有匹配的曲谱</div>'}</div><div class="qx-section-heading qx-folder-heading"><h2>${icon('folders')}分类谱夹</h2></div><div class="qx-folder-row"><button type="button" data-filter="古典">${icon('music-2')}<span>古典独奏<small>4 首</small></span>${icon('chevron-right')}</button><button type="button" data-filter="入门">${icon('sprout')}<span>入门练习<small>2 首</small></span>${icon('chevron-right')}</button><button type="button" data-route="library">${icon('bookmark')}<span>我的收藏<small>${state.favorites.length} 首</small></span>${icon('chevron-right')}</button></div>`;}
function library(){let list=scores.filter(s=>state.favorites.includes(s.id)||(state.imported&&s.id==='summer'));if(state.libraryFilter==='我的收藏')list=list.filter(s=>state.favorites.includes(s.id));if(state.libraryFilter==='最近练习')list=list.filter(s=>s.id==='moon');if(state.libraryFilter==='我的导入')list=state.imported?[scores[4]]:[];const icons={'全部曲谱':'library','我的收藏':'bookmark','最近练习':'history','我的导入':'file-input'};return `<div class="qx-page-heading"><h1 class="qx-page-title">我的谱架</h1><div class="qx-action-row"><button type="button" class="qx-secondary" data-action="cover-manager">${icon('image-plus')}封面</button><button type="button" class="qx-primary" data-action="import">${icon('plus')}导入曲谱</button></div></div><div class="qx-pills" aria-label="谱架分类">${Object.keys(icons).map(f=>`<button type="button" data-library-filter="${f}" aria-pressed="${state.libraryFilter===f}">${icon(icons[f])}${f}</button>`).join('')}</div><div class="qx-library-list">${list.map(s=>`<div class="qx-library-entry"><button class="qx-library-row" type="button" data-score="${s.id}"><div class="qx-library-thumb">${cover(s)}</div><div><h3>${s.title}</h3><p>${icon('user-round')}${s.zh}<span>·</span>${level(s)}${s.tag}</p></div><span>${s.id==='moon'?'最近练习':(s.id==='summer'&&state.imported?'已导入':'已收藏')}</span>${icon('chevron-right')}</button><button class="qx-row-cover" type="button" data-cover-score="${s.id}" aria-label="更换${s.title}封面">${icon('image-plus')}</button></div>`).join('')||'<div class="qx-empty">暂无曲谱</div>'}</div><div class="qx-footer-line"><span>${icon('library')}${list.length} 首</span></div>`;}
function sheet(practice=false){const phone=state.device==='phone'||phoneByWidth;const measureColumns=phone||practice?4:2;const startMeasure=practice&&phone?5+Math.floor((state.measure-5)/4)*4:5;const seq=[[30,20,15,10],[25,10,20,5],[20,25,10,15],[15,5,20,10]];let rows='';for(let r=0;r<(phone?1:2);r++){rows+=`<div class="qx-sheet-line"><div class="qx-clefs" aria-hidden="true"><span>𝄞</span><span>𝄢</span></div>`;for(let m=0;m<measureColumns;m++){const num=practice?(r*measureColumns+m+startMeasure):(r*measureColumns+m+1);rows+=`<div class="qx-measure ${practice&&num===state.measure?'active':''}" data-measure="${num}"><span class="qx-measure-number">${num}</span>${[0,1].map(staff=>`<div class="qx-staff" style="opacity:${practice&&((state.hand==='左手'&&staff===0)||(state.hand==='右手'&&staff===1))?0.25:1}">${seq[(m+r)%4].map((y,n)=>`<span class="qx-note ${practice&&num<state.measure?'hit':''} ${practice&&num===state.measure&&n===0?'next':''}" style="left:${15+n*23}%;top:${staff?35-y/2:y}px"></span>`).join('')}</div>`).join('')}</div>`;}rows+='</div>';}
return `<section class="qx-sheet" aria-label="${selected().title}的排版示意，非实际可演奏曲谱"><div class="qx-sheet-title">${selected().title}</div><div class="qx-sheet-byline">${state.version} · ${selected().composer}</div>${rows}<p class="qx-sheet-note">谱面仅用于展示布局与交互，不对应实际作品音符。</p></section>`;}
function detail(){const s=selected(),saved=state.favorites.includes(s.id);return `<button class="qx-back" type="button" data-route="discover">${icon('arrow-left')}返回找谱</button><div class="qx-detail-head">${cover(s)}<div><h1 class="qx-page-title">${s.title}</h1><p>${s.composer} · ${s.zh}</p><div class="qx-tags"><span>${icon('signal')}${s.tag}</span><span>${icon('music-2')}${s.key}</span><span>${icon('timer')}${s.time} 拍</span><span>${icon('piano')}独奏</span></div><div class="qx-action-row"><button type="button" class="qx-primary" data-action="start">${icon('play')}开始练习</button><button type="button" class="qx-secondary" data-action="favorite" aria-pressed="${saved}">${icon(saved?'bookmark-check':'bookmark')}${saved?'已入谱架':'加入谱架'}</button><button type="button" class="qx-secondary" data-cover-score="${s.id}" aria-label="更换封面">${icon('image-plus')}</button></div></div></div><div class="qx-version-row"><div>${icon('files')}<strong>曲谱版本</strong></div><div class="qx-segments" aria-label="曲谱版本">${['原版','简易版'].map(v=>`<button type="button" data-version="${v}" aria-pressed="${state.version===v}">${v}</button>`).join('')}</div></div>${sheet()}`;}
function keyboard(){const names=['C','D','E','F','G','A','B','C','D','E','F','G','A','B'];return `<div class="qx-keyboard" aria-label="演示键盘，不发声">${names.map((n,i)=>`<button type="button" class="qx-white-key ${i===7?'current':''}" data-key="${i}" aria-label="演示琴键 ${n}${i<7?3:4}">${n==='C'?n+(i<7?3:4):''}</button>`).join('')}${[0,1,3,4,5,7,8,10,11,12].map(i=>`<button type="button" class="qx-black-key" data-key="b${i}" aria-label="演示升音键 ${names[i]}" style="left:${(i+1)*100/14-2.1}%"></button>`).join('')}</div>`;}
function practice(){return `<div class="qx-practice-heading"><div><button class="qx-back" type="button" data-route="detail" style="margin-bottom:12px">${icon('arrow-left')}曲谱详情</button><h1>${selected().title}</h1><p>${selected().zh} · ${state.version} · ${state.hand} · ${state.connected?'MIDI 演示连接':'触屏演示'}</p></div><button type="button" class="qx-secondary" data-action="finish">结束练习 ${icon('arrow-up-right')}</button></div><div class="qx-practice-tools"><div class="qx-segments" aria-label="练习模式">${['跟弹','自由看谱','节奏'].map(v=>`<button type="button" data-mode="${v}" aria-pressed="${state.mode===v}">${icon({'跟弹':'piano','自由看谱':'book-open','节奏':'timer'}[v])}${v}</button>`).join('')}</div><div class="qx-segments" aria-label="练习手">${['双手','左手','右手'].map(v=>`<button type="button" data-hand="${v}" aria-pressed="${state.hand===v}">${icon('hand')}${v}</button>`).join('')}</div></div><div class="qx-practice-meta"><span>第 <span id="qx-measure-value">${state.measure}</span> 小节 / 示意片段 5–12</span><span>${icon('sparkles')}交互演示 · 不进行真实判音</span></div>${sheet(true)}<div class="qx-feedback"><span>${icon('music-2')}<span id="qx-feedback-text">${state.playing?'演示进行中，点击琴键推进谱面。':'待开始 · 点击开始演示'}</span></span><small>${state.mode==='跟弹'?'跟弹 · 弹对当前音再向前':state.mode==='自由看谱'?'自由看谱 · 按自己的节奏':'节奏 · 跟随稳定的拍点'}</small></div>${keyboard()}<div class="qx-transport"><label class="qx-tempo">${icon('gauge')}<strong id="qx-bpm">${state.tempo}</strong><span>BPM</span><input type="range" min="40" max="140" value="${state.tempo}" aria-label="练习速度"></label><div class="qx-play-controls"><button type="button" class="qx-icon-button" data-action="restart" aria-label="从片段开头重来">${icon('rotate-ccw')}</button><button type="button" class="qx-primary" data-action="play">${icon(state.playing?'pause':'play')}<span>${state.playing?'暂停演示':'开始演示'}</span></button><button type="button" class="qx-icon-button" data-action="next" aria-label="演示下一小节">${icon('skip-forward')}</button></div><button type="button" class="qx-loop-button" data-action="loop" aria-pressed="${state.loop}">${icon('repeat-2')}${state.loop?'循环 '+state.loopStart+'–'+state.loopEnd+' 小节':'小节循环'}</button></div>`;}
function report(){return `<div class="qx-page-heading"><div><h1 class="qx-page-title">练习记录</h1><p class="qx-subtitle">本次练习报告 · 示例数据</p></div><button type="button" class="qx-secondary" data-route="library">回到谱架 ${icon('arrow-right')}</button></div><section class="qx-report-banner"><div><h2>${selected().title}</h2><p>${selected().title} · ${state.hand} · ${state.tempo} BPM</p></div><div class="qx-report-flower" aria-hidden="true">${icon('circle-check')}</div></section><div class="qx-stat-grid"><div class="qx-stat"><span>${icon('clock-3')}练习时长</span><strong>18<small>分钟</small></strong></div><div class="qx-stat"><span>${icon('music-2')}音高正确率</span><strong>92<small>%</small></strong></div><div class="qx-stat"><span>${icon('timer')}节奏稳定率</span><strong>86<small>%</small></strong></div></div><section class="qx-report-chart"><div class="qx-section-heading"><h2>${icon('chart-no-axes-column')}小节表现</h2><small>各小节音高正确率 · 示例</small></div><div class="qx-review-bars" role="img" aria-label="示例小节正确率，第7、8小节偏低">${[96,92,73,68,88,97,94,96].map((n,i)=>`<div class="qx-review-bar ${i===2||i===3?'weak':''}" style="height:${n}%" aria-label="第${i+5}小节 ${n}%"></div>`).join('')}</div><div class="qx-review-labels">${Array.from({length:8},(_,i)=>`<span>${i+5}</span>`).join('')}</div></section><div class="qx-review-tip"><div><h3>第 7–8 小节 · 左手衔接</h3><p>建议：左手 · 54 BPM · 分段循环</p></div><button type="button" class="qx-primary" data-action="retry">${icon('repeat-2')}练这个片段</button></div><div class="qx-footer-line"><span>成绩仅为设计示例，未采集演奏数据。</span><button type="button" class="qx-link" data-action="start">再完整弹一遍 ${icon('arrow-right')}</button></div>`;}
function save(){const snapshot={modelContent:{design:'琴序 · 米白朱砂',screen:state.route,device:state.device,selectedScore:selected().title},privateContent:{...state,playing:false,designVersion:2}};lastSavedSnapshot=JSON.stringify(snapshot.privateContent);if(window.openai?.setWidgetState)window.openai.setWidgetState(snapshot).catch(()=>{});}
function restore(value){const p=value?.privateContent;if(!p||p.designVersion!==2||!navItems.some(n=>n[0]===p.route)&&p.route!=='detail')return;state={...state,...p,playing:false};if(!scores.some(s=>s.id===state.selected))state.selected='moon';if(!Array.isArray(state.favorites))state.favorites=['moon'];}
function refreshIcons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});}
function render(){app.classList.toggle('qx-report-shell',state.route==='report');clearTimeout(toastTimer);root.querySelector('.qx-toast').hidden=true;app.classList.toggle('qx-practice-shell',state.route==='practice');root.classList.toggle('qx-phone',state.device==='phone'||phoneByWidth);root.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===state.device)));const nav=navItems.map(([route,name,label])=>`<button type="button" data-route="${route}" ${state.route===route?'aria-current="page"':''}>${icon(name)}<span>${label}</span></button>`).join('');root.querySelector('.qx-nav').innerHTML=nav;root.querySelector('.qx-bottom-nav').innerHTML=`<button type="button" class="qx-rail-brand" data-route="discover" aria-label="琴序首页"><span class="qx-logomark" aria-hidden="true"><span class="qx-logo-key"></span><span class="qx-logo-key"></span></span></button>`+nav;root.querySelector('.qx-breadcrumb').textContent={discover:'发现 / 为你推荐',library:'我的谱架 / 随身乐谱书',detail:'发现 / 曲谱详情',practice:'琴序 / 专注练习',report:'练习记录 / 本次复盘'}[state.route];main.innerHTML=({discover,library,detail,practice,report}[state.route]||discover)();refreshIcons();}
function route(to){state.playing=false;state.route=to;render();save();}
function toast(msg){const el=root.querySelector('.qx-toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},2600);}
function closeDialog(){root.querySelector('.qx-overlay').hidden=true;if(previousFocus?.isConnected)previousFocus.focus();}
function dialog(type){previousFocus=document.activeElement;const el=root.querySelector('.qx-dialog');el.innerHTML=`<div class="qx-dialog-header"><h2 id="qx-dialog-title">${type==='device'?'连接钢琴':'导入曲谱'}</h2><button type="button" class="qx-icon-button" data-action="close-dialog" aria-label="关闭">${icon('x')}</button></div>${type==='device'?`<button type="button" class="qx-dialog-choice" data-action="connect">${icon('cable')}<span><h3>MIDI 钢琴</h3><small>USB / 蓝牙 MIDI · 演示连接流程</small></span>${icon('chevron-right')}</button><button type="button" class="qx-dialog-choice" data-action="touch">${icon('hand')}<span><h3>屏幕琴键</h3><small>无需连接设备 · 本原型不发声</small></span>${icon('chevron-right')}</button><p>麦克风单音识别 · 实验功能，准确率待实琴验证。</p>`:`<button type="button" class="qx-dialog-choice" data-action="import-demo">${icon('file-music')}<span><h3>从文件导入 MusicXML</h3><small>点击添加一份示例曲谱，体验导入后的界面</small></span>${icon('chevron-right')}</button><p>这是界面演示，不会读取或保存设备文件。</p>`}`;root.querySelector('.qx-overlay').hidden=false;refreshIcons();el.querySelector('button').focus();}
function coverDialog(scoreID){if(root.querySelector('.qx-overlay').hidden)previousFocus=document.activeElement;const target=scores.find(s=>s.id===scoreID)||selected();const el=root.querySelector('.qx-dialog');el.innerHTML=`<div class="qx-dialog-header"><h2 id="qx-dialog-title">曲谱封面</h2><button type="button" class="qx-icon-button" data-action="close-dialog" aria-label="关闭">${icon('x')}</button></div><label class="qx-cover-select-label">选择曲谱<select id="qx-cover-score">${scores.map(s=>`<option value="${s.id}" ${s.id===target.id?'selected':''}>${s.title}</option>`).join('')}</select></label><div class="qx-cover-editor-preview">${cover(target)}</div><label class="qx-file-label">${icon('image-plus')}选择封面图片<input type="file" id="qx-cover-file" accept="image/jpeg,image/png,image/webp"></label><p>JPG / PNG / WebP · 最大 8 MB<br>仅用于本次预览，不上传图片。</p><p id="qx-cover-error" role="alert" hidden></p>${coverImages.has(target.id)?`<button type="button" class="qx-secondary" data-remove-cover="${target.id}">${icon('rotate-ccw')}恢复默认封面</button>`:''}`;root.querySelector('.qx-overlay').hidden=false;refreshIcons();el.querySelector('select').focus();}
function advance(){if(state.route!=='practice')return;const end=state.loop?state.loopEnd:12;if(state.measure>=end&&!state.loop){state.playing=false;render();root.querySelector('#qx-feedback-text').textContent='示意片段已结束，可以查看复盘或从头再练。';save();return;}state.measure=state.measure>=end?(state.loop?state.loopStart:5):state.measure+1;root.querySelector('#qx-measure-value').textContent=state.measure;root.querySelector('.qx-sheet').outerHTML=sheet(true);root.querySelector('#qx-feedback-text').textContent=`第 ${state.measure} 小节`;save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.route){route(b.dataset.route);return;}if(b.dataset.device){state.device=b.dataset.device;render();save();return;}if(b.dataset.coverScore){coverDialog(b.dataset.coverScore);return;}if(b.dataset.removeCover){const old=coverImages.get(b.dataset.removeCover);if(old)URL.revokeObjectURL(old);coverImages.delete(b.dataset.removeCover);render();coverDialog(b.dataset.removeCover);return;}if(b.dataset.favoriteScore){const id=b.dataset.favoriteScore;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];render();save();return;}if(b.dataset.startScore){state.selected=b.dataset.startScore;state.tempo=selected().bpm;state.measure=5;state.loop=false;route('practice');return;}if(b.dataset.score){state.selected=b.dataset.score;state.tempo=selected().bpm;state.version='原版';route('detail');return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();save();return;}if(b.dataset.libraryFilter){state.libraryFilter=b.dataset.libraryFilter;render();save();return;}if(b.dataset.version){state.version=b.dataset.version;render();save();return;}if(b.dataset.hand){state.hand=b.dataset.hand;render();save();return;}if(b.dataset.mode){state.mode=b.dataset.mode;state.playing=false;render();save();return;}if(b.dataset.key){if(!state.playing){toast('点击「开始演示」，再体验琴键与谱面的联动。');return;}b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),180);advance();return;}switch(b.dataset.action){case 'collection':state.filter='古典';state.query='';render();save();toast('已展开「慢下来的音乐」古典谱集');break;case 'continue':state.selected='moon';state.measure=5;state.tempo=66;state.version='原版';state.hand='双手';state.mode='跟弹';state.loop=false;state.loopStart=5;state.loopEnd=8;route('practice');break;case 'start':state.measure=5;state.loop=false;route('practice');break;case 'favorite':state.favorites=state.favorites.includes(state.selected)?state.favorites.filter(id=>id!==state.selected):[...state.favorites,state.selected];render();save();break;case 'collection-favorites':state.libraryFilter='我的收藏';render();save();break;case 'collection-recent':state.libraryFilter='最近练习';render();save();break;case 'cover-manager':coverDialog(state.selected);break;case 'import':dialog('import');break;case 'import-demo':state.imported=true;state.libraryFilter='我的导入';closeDialog();render();save();toast('示例曲谱已加入「我的导入」');break;case 'device':dialog('device');break;case 'close-dialog':closeDialog();break;case 'connect':state.connected=true;closeDialog();render();save();toast('MIDI 连接状态演示 · 未连接真实设备');break;case 'touch':state.connected=false;closeDialog();route('practice');break;case 'play':state.playing=!state.playing;render();save();break;case 'restart':state.measure=state.loop?state.loopStart:5;state.playing=false;render();save();break;case 'next':advance();break;case 'loop':state.loop=!state.loop;state.loopStart=5;state.loopEnd=8;state.measure=5;render();save();break;case 'finish':route('report');break;case 'retry':state.tempo=54;state.hand='左手';state.loop=true;state.loopStart=7;state.loopEnd=8;state.measure=7;route('practice');break;}});
root.addEventListener('input',e=>{if(e.target.id==='qx-search'){state.query=e.target.value;root.querySelector('#qx-score-results').innerHTML=filtered().map(scoreCard).join('')||'<div class="qx-empty">没有匹配的曲谱</div>';root.querySelector('#qx-result-count').textContent=filtered().length+' 首';refreshIcons();save();}if(e.target.type==='range'){state.tempo=Number(e.target.value);root.querySelector('#qx-bpm').textContent=state.tempo;save();}});
root.addEventListener('change',e=>{
  if(e.target.id==='qx-cover-score'){coverDialog(e.target.value);return;}
  if(e.target.id!=='qx-cover-file')return;
  const file=e.target.files?.[0];
  if(!file)return;
  const targetID=root.querySelector('#qx-cover-score').value;
  const reportError=message=>{const el=root.querySelector('#qx-cover-error');if(el){el.textContent=message;el.hidden=false;}else toast(message);};
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){reportError('请选择 JPG、PNG 或 WebP 图片。');return;}
  if(file.size>8*1024*1024){reportError('图片超过 8 MB，请选择较小的封面。');return;}
  const source=URL.createObjectURL(file),image=new Image();
  image.onload=()=>{if(!image.naturalWidth||!image.naturalHeight){URL.revokeObjectURL(source);reportError('无法读取这张图片，请重新选择。');return;}const previous=coverImages.get(targetID);if(previous)URL.revokeObjectURL(previous);coverImages.set(targetID,source);render();if(!root.querySelector('.qx-overlay').hidden)coverDialog(targetID);toast('封面已更新');};
  image.onerror=()=>{URL.revokeObjectURL(source);reportError('无法读取这张图片，请重新选择。');};
  image.src=source;
});

root.addEventListener('keydown',e=>{const overlay=root.querySelector('.qx-overlay');if(overlay.hidden)return;if(e.key==='Escape'){closeDialog();return;}if(e.key==='Tab'){const buttons=[...overlay.querySelectorAll('button,select,input')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState && JSON.stringify(e.detail.globals.widgetState.privateContent)!==lastSavedSnapshot){restore(e.detail.globals.widgetState);render();}});
if(globalThis.ResizeObserver)new ResizeObserver(entries=>{const small=entries[0].contentRect.width<651;if(small!==phoneByWidth){phoneByWidth=small;render();}}).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--qx-accent',design.accent);root.style.setProperty('--qx-radius',design.radius+'px');}});tweak.addColorPicker(design,'accent',{label:'品牌强调色',reference:'--qx-accent'});tweak.addSlider(design,'radius',{label:'卡片圆角',min:4,max:26,unit:'px',reference:'--qx-radius'});}
})();
</script>
