name: Verify QinXu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test and build iOS Simulator
        run: bash scripts/verify.sh --require-ios
      - name: Build macOS preview
        run: bash scripts/build-macos.sh
